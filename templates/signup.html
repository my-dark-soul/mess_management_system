{% extends "base.html" %}
{% block title %}Monitor Signup{% endblock %}
{% block content %}
<div class="flex items-center justify-center py-10">
  <div class="bg-white p-8 rounded-lg shadow w-full max-w-md">
    <h2 class="text-2xl font-semibold text-center mb-6">Monitor Signup</h2>
    {% if error %}<div class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4">{{ error }}</div>{% endif %}
    <form method="POST" action="/signup" enctype="multipart/form-data" class="space-y-4">
      <div>
        <label class="block text-gray-700 font-medium mb-1">Full Name</label>
        <input type="text" name="name" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring"/>
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-1">Email</label>
        <input type="email" name="email" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring"/>
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-1">Phone</label>
        <input type="text" name="phone" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring"/>
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-1">Password</label>
        <input type="password" name="password" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring"/>
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-1">Confirm Password</label>
        <input type="password" name="confirm_password" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring"/>
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-1">Mess Location</label>
        <input type="text" name="mess_location" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring"/>
      </div>
      <div>
        <label class="block text-gray-700 font-medium mb-1">Photo (optional)</label>
        <input type="file" name="photo" accept="image/*" class="w-full border border-gray-300 rounded px-3 py-2"/>
      </div>
      <button type="submit" class="w-full bg-blue-500 text-white font-semibold py-2 px-4 rounded hover:bg-blue-600 transition">Sign Up</button>
      <p class="text-center text-sm mt-2">Already have an account? <a href="/signin" class="text-blue-600 hover:underline">Signin</a></p>
    </form>
  </div>
</div>
{% endblock %}
