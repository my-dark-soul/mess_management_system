{% extends 'base.html' %} {% block title %}Monitor Signup{% endblock %} {% block
content %}
<div class="flex items-center justify-center bg-gray-300 py-10">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-semibold text-center mb-6">Monitor Signup</h2>

    <form
      method="POST"
      action="{{ url_for('signup') }}"
      enctype="multipart/form-data"
    >
      <div class="mb-4">
        <div id="photo-preview" class="mt-2"></div>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-1" for="name"
          >Full Name</label
        >
        <input
          type="text"
          id="name"
          name="name"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-400"
          required
        />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-1" for="email"
          >Email</label
        >
        <input
          type="email"
          id="email"
          name="email"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-400"
          required
        />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-1" for="phone"
          >Phone</label
        >
        <input
          type="phone"
          id="phone"
          name="phone"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-400"
          required
        />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-1" for="password"
          >Password</label
        >
        <input
          type="password"
          id="password"
          name="password"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-400"
          required
        />
      </div>

      <div class="mb-6">
        <label
          class="block text-gray-700 font-medium mb-1"
          for="confirm_password"
          >Confirm Password</label
        >
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-400"
          required
        />
      </div>

      <div class="mb-4">
        <label for="photo" class="block text-gray-800 font-semibold mb-1"
          >Monitor Photo</label
        >
        <input
          type="file"
          id="photo"
          name="photo"
          accept="image/*"
          class="w-full px-4 py-2 rounded-md border border-gray-300 focus:outline-none focus:border-blue-400"
        />
      </div>

      <div class="mb-6">
        <label
          class="block text-gray-700 font-medium mb-1"
          for="mess_location"
          >Location</label
        >
        <input
          type="text"
          id="mess_location"
          name="mess_location"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-400"
          required
        />
      </div>

      <button
        type="submit"
        class="w-full bg-blue-500 text-white font-semibold py-2 px-4 rounded hover:bg-blue-600 transition duration-200"
      >
        Sign Up
      </button>
      <p class="mt-4">
        Already have an account?
        <a class="text-blue-600 hover:underline" href='{{ url_for("signin") }}'
          >Signin</a
        >
      </p>
    </form>
  </div>
</div>
{% endblock %}
