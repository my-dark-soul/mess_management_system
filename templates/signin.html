{% extends 'base.html' %} {% block title %}Monitor Signin{% endblock %} {% block
content %}
<div class="flex items-center justify-center bg-gray-300 py-10">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-semibold text-center mb-6">Monitor SignIn</h2>

    <form method="POST" action="{{ url_for('signin') }}">
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-1" for="phone"
          >Phone</label
        >
        <input
          type="phone"
          id="phone"
          name="phone"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-400"
          required
        />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-1" for="password"
          >Password</label
        >
        <input
          type="password"
          id="password"
          name="password"
          class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring focus:border-blue-400"
          required
        />
      </div>
      <button
        type="submit"
        class="w-full bg-blue-500 text-white font-semibold py-2 px-4 rounded hover:bg-blue-600 transition duration-200"
      >
        Sign In
      </button>
      <p class="mt-4">
        Don't have an account?
        <a class="text-blue-600 hover:underline" href='{{ url_for("signup") }}'
          >Signup</a
        >
      </p>
    </form>
  </div>
</div>
{% endblock %}
